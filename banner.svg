<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d675"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- circuit-style corner accents -->
  <path d="M20 20 L20 60 L60 60" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M880 200 L880 160 L840 160" stroke="#d4af37" stroke-width="2" fill="none" opacity="0.5"/>
  <circle cx="20" cy="20" r="3" fill="#d4af37"/>
  <circle cx="880" cy="200" r="3" fill="#d4af37"/>

  <!-- small OLED icon -->
  <rect x="60" y="80" width="120" height="60" rx="4" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <rect x="72" y="92" width="96" height="36" rx="2" fill="#111"/>
  <rect x="80" y="100" width="50" height="6" fill="#d4af37" opacity="0.8"/>
  <rect x="80" y="112" width="30" height="6" fill="#d4af37" opacity="0.5"/>

  <!-- signal / wifi arcs -->
  <path d="M220 130 Q235 105 260 100" stroke="#d4af37" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M220 130 Q245 90 285 85" stroke="#d4af37" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>

  <text x="320" y="105" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="bold" fill="#f2d675">FRC Pit Terminal</text>
  <text x="320" y="140" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#999" letter-spacing="1">ESP8266 &#183; OLED &#183; The Blue Alliance API</text>

  <rect x="320" y="160" width="8" height="8" fill="#d4af37"/>
  <text x="336" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777">Live match data</text>
  <rect x="470" y="160" width="8" height="8" fill="#d4af37"/>
  <text x="486" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777">Web-based setup</text>
  <rect x="630" y="160" width="8" height="8" fill="#d4af37"/>
  <text x="646" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777">Buzzer alerts</text>
</svg>
